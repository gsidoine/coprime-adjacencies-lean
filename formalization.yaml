# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Minimum Number of Coprime Adjacencies in a Permutation"
  description: >-
    A Lean 4 formalization of the exact minimum number of coprime adjacent
    pairs over all permutations of the first n positive integers, valid
    unconditionally for every n at least four. The proof constructs optimal
    paths in the graph joining noncoprime integers.
  authors: ["Guillaume Sidoine"]
  responsible_maintainers: ["Guillaume Sidoine"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C38", "11A41"]

sources:
  - title: "The Minimum Number of Coprime Adjacencies in a Permutation"
    authors: ["Guillaume Sidoine"]
    id: "https://github.com/gsidoine/the-scottish-book/blob/f73a76cd5e33ee822ae572953195f9549efec4ed/theorems/P010-exact-coprime-adjacencies.md"
    type: "paper"
    location: "Manuscript submitted to Integers, 2026; submitted is not accepted or published."
    relationship: "formalizes"
    note: >-
      The exact formula and constructive path-cover proof appear in the
      cited manuscript and mathematical dossier. Historical priority and
      journal acceptance have not been established.

related_formalizations:
  - id: "https://github.com/gsidoine/the-scottish-book/tree/f73a76cd5e33ee822ae572953195f9549efec4ed/formal/P010"
    relationship: "adapts"
    note: "The substantive Lean proof was moved without changing its mathematical argument."

status:
  scope: >-
    The exact formula for the minimum number of coprime adjacencies
    over permutations of [1,n] is proved for every n >= 4. The
    prime-number-theorem asymptotic is not formalized here. The
    Challenge contains one deliberate sorry in the advertised
    theorem, excluded from the Solution proof counts.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - "CoprimeAdjacencies.exact_minimum_coprime_adjacencies"

automation:
  methods:
    - method: "copilot"
      models: ["ChatGPT (OpenAI; specific model versions not consistently recorded)"]
      framework: "ChatGPT and Lean 4 / Mathlib"
      tool_setup: >-
        AI-assisted Lean proof drafting, tactic-level repairs and
        review of mathematical definitions, followed by GitHub Actions
        compilation and kernel axiom audits.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based; not separately tracked"
        hardware: "GitHub Actions Linux runners"
      prompting_notes: >-
        Iterative mathematical proof development and formalization;
        draft steps were checked by Lean compilation and kernel
        verification rather than accepted from model output.
  spend_usd: "subscription-based; not separately tracked"
  notes: >-
    The human author supplied the research direction and selected the
    claims; Lean implementation used substantial ChatGPT assistance.
    Successful kernel checking does not establish historical novelty
    or independent mathematical refereeing.

fidelity:
  divergences: >-
    None known for the exact finite-n identity. Natural-number
    division represents floor, and (k + 1)/2 represents ceiling
    of k/2 for k nonnegative. The asymptotic corollary is not included.

review:
  status: "self-assessed; kernel-checked, not independently refereed"
  reviewers: []
  notes: >-
    Challenge and Solution encode the same theorem, with explicit
    definitions of permutations, adjacent coprime pairs, prime counting,
    and the least attained score. The proof is unconditional for all
    n >= 4. The original manuscript remains an archival submission.

alignment:
  namespace: "CoprimeAdjacencies"
  statements:
    - source: "The exact theorem in The Minimum Number of Coprime Adjacencies in a Permutation"
      lean: "CoprimeAdjacencies.exact_minimum_coprime_adjacencies"
      module: "Solution"
      status: "proved"
      note: >-
        The Challenge statement is independent of the proof module;
        its supporting definitions are reproduced exactly from the
        P010 statement module, and the Solution uses the original
        kernel-checked P010.P010_exact theorem.

acknowledgements: >-
  Mathlib, Lean 4, GitHub Actions, and AI-assisted drafting tools.
